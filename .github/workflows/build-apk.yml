name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.native=false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Tự động tìm vị trí của file gradlew và cấp quyền chạy
      - name: Grant Execute Permission for Gradle
        run: |
          GRADLEW_PATH=$(find . -name gradlew -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ Không tìm thấy file gradlew trong toàn bộ dự án!"
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          echo "PROJECT_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

      # Chuẩn bị file debug.keystore để ký APK (từ base64 hoặc tạo mới nếu chưa có)
      - name: Setup debug.keystore
        run: |
          cd ${{ env.PROJECT_DIR }}
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Khôi phục debug.keystore từ debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            echo "Tạo mới debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      # Di chuyển vào đúng thư mục chứa dự án để chạy lệnh build
      - name: Assemble Debug Build
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug

      - name: Prepare Release APK
        run: |
          mkdir -p release-apk
          TV_APK_FILE=$(find "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          if [ -z "$TV_APK_FILE" ]; then
            echo "❌ Không tìm thấy file APK bản TV Music sau khi build!"
            exit 1
          fi
          cp "$TV_APK_FILE" "release-apk/TV-Music-v1.0.${{ github.run_number }}.apk"

          MOBILE_APK_FILE=$(find "${{ env.PROJECT_DIR }}/mobile/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          if [ -z "$MOBILE_APK_FILE" ]; then
            echo "❌ Không tìm thấy file APK bản Mobile Server WiFi sau khi build!"
            exit 1
          fi
          cp "$MOBILE_APK_FILE" "release-apk/Mobile-Server-WiFi-v1.0.${{ github.run_number }}.apk"
          ls -lh release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-music-and-mobile-server-apks
          path: "release-apk/*.apk"
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "TV Music & Mobile Server WiFi v1.0.${{ github.run_number }}"
          body: |
            Bản build tự động (`v1.0.${{ github.run_number }}`) gồm 2 file APK cài đặt song song:
            - **TV-Music-v1.0.${{ github.run_number }}.apk**: Cài lên **Android TV** (hoặc điện thoại làm đầu phát).
            - **Mobile-Server-WiFi-v1.0.${{ github.run_number }}.apk**: Cài lên **điện thoại** để chọn **"Đặt máy này làm Server nhạc"**, Tivi quét và phát trực tiếp qua Wi-Fi không cần chép file.
          files: "release-apk/*.apk"
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
